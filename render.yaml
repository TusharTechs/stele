# A free, always-available copy of the studio.
#
# Vercel hosts the record and cannot host the studio: a render takes minutes against a function
# timeout, writes project files to disk, and talks to a knowledge store on localhost. Render runs
# the same app as an ordinary long-lived Node process, which is what it was built for, so a visitor
# can write a brief and actually press Run.
#
# Two properties of the free plan shape this. There is no persistent disk, so the seeded record is
# baked in at build time and anything a visitor creates lives until the instance restarts. And the
# instance sleeps after fifteen minutes idle, so the first request after a quiet spell waits about a
# minute for it to wake.
services:
  - type: web
    name: stele
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # No DKG node is reachable from here. The in-process store runs the same SPARQL over the same
      # ontology, and every page says so rather than implying a node that is not there.
      - key: STELE_DKG
        value: file
      # Unset on purpose. Without it the studio runs on Livepeer's keyless demo allowance, so a
      # visitor pressing Run spends nothing of the author's. The allowance is capped per address and
      # shared by everyone here, which the interface reports when it runs low.
      - key: LIVEPEER_API_KEY
        sync: false
