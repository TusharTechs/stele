<!--
  The wordmark for light surfaces.

  Not the dark one inverted. Verdigris at its screen value is 2.31:1 on white, so the mark is cut
  deeper here to clear the 3:1 a graphic needs while staying recognisably the same colour, and the
  name goes to near-black rather than to grey. Measured on #ffffff: mark 4.68, name 17.88,
  tagline 5.62.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 20 250 66" fill="none" role="img" aria-label="Stele. Every frame, on the record.">
  <g transform="translate(16,20) scale(2.35)">
    <path d="M6.4 20.6 7.6 5.2h8.8l1.2 15.4z" stroke="#25835f" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M4.6 20.6h14.8" stroke="#25835f" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M9.6 10.2l4.7 2.9M14.3 13.1 9.6 16" stroke="#25835f" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="9.6" cy="10.2" r="1.45" fill="#25835f"/>
    <circle cx="14.6" cy="13.1" r="1.45" fill="#25835f"/>
    <circle cx="9.6" cy="16" r="1.45" fill="#25835f"/>
  </g>
  <text x="80" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="32" font-weight="600" letter-spacing="6.4" fill="#17171b">STELE</text>
  <text x="82" y="74" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#6b6760">every frame, on the record</text>
</svg>
