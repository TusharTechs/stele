<!--
  The wordmark for dark surfaces.

  Two files rather than one, because a README is read on whichever theme the reader chose and a
  single asset cannot be legible on both: the bone name measured 1.12:1 on GitHub's white, and the
  verdigris mark 1.68:1, so the banner was a tagline floating beside two ghosts. The viewBox is
  cropped to the artwork so the image centres on its own content instead of on a box of air.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 20 250 66" fill="none" role="img" aria-label="Stele. Every frame, on the record.">
  <g transform="translate(16,20) scale(2.35)">
    <path d="M6.4 20.6 7.6 5.2h8.8l1.2 15.4z" stroke="#6ddcb0" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M4.6 20.6h14.8" stroke="#6ddcb0" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M9.6 10.2l4.7 2.9M14.3 13.1 9.6 16" stroke="#6ddcb0" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="9.6" cy="10.2" r="1.45" fill="#6ddcb0"/>
    <circle cx="14.6" cy="13.1" r="1.45" fill="#6ddcb0"/>
    <circle cx="9.6" cy="16" r="1.45" fill="#6ddcb0"/>
  </g>
  <text x="80" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="32" font-weight="600" letter-spacing="6.4" fill="#f4f2ee">STELE</text>
  <text x="82" y="74" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#918c85">every frame, on the record</text>
</svg>
